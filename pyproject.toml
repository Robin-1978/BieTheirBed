[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knoa"
dynamic = ["version"]
description = "Knoa platform and built-in agent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "mss>=9.0",
    "pyperclip>=1.8",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "ddgs>=9.0",
    "textual>=8.2.0",
    "pyautogui>=0.9.54",
    "pywinctl>=0.0.5",
    "plyer>=2.1.0",
    "jsonschema>=4.0",
    "websockets>=14.0,<16",
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
    "lark-oapi>=1.6,<2",
    "mcp>=2,<3",
    "cryptography>=42,<46",
    "qrcode>=8,<9",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=5.0,<6",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
[project.scripts]
knoa = "knoa_platform:main"
knoa-hub = "knoa_platform.hub.__main__:main"
knoa-hub-admin = "knoa_platform.hub.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knoa_platform", "src/knoa_agent", "src/knoa_agent_contracts", "src/knoa_codex_agent"]

[tool.hatch.version]
path = "src/knoa_platform/__init__.py"

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.feishu_open_id",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/knoa_platform",
    "/src/knoa_agent",
    "/src/knoa_agent_contracts",
    "/src/knoa_codex_agent",
    "/tests",
    "/config/default.yaml",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "knoa_platform/resources/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests requiring an explicitly enabled external LLM service",
]

[tool.coverage.run]
source = [
    "knoa_platform.agent_runtime",
    "knoa_platform.artifacts",
    "knoa_platform.context.memory_db",
    "knoa_platform.context.scope",
    "knoa_platform.desktop_session",
    "knoa_platform.service.core_api",
    "knoa_platform.service.core_client",
    "knoa_platform.service.core_host",
    "knoa_platform.service.core_server",
    "knoa_platform.tools.base",
    "knoa_platform.tools.registry",
]
omit = ["src/knoa_platform/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 80
