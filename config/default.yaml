# Named API accounts/endpoints. Cloud accounts and their keys belong in the
# per-user ~/.knoa/config/local.yaml file, outside the source tree.
providers:
  local_llama:
    driver: "llamacpp"
    server_url: "http://127.0.0.1:8192"
    requires_api_key: false
    timeout: 120

# Stable application aliases mapped to upstream model identifiers.
models:
  local_default:
    provider: "local_llama"
    model: ""
    supports_vision: true
    context_window: 8192

default_model: "local_default"
fallback_enabled: true
fallback_model: ""

# Single-model fallback fields used only when providers/models are absent.
llm_provider: "llamacpp"
llm_server_url: "http://127.0.0.1:8192"
llm_model_name: ""
llm_api_key: ""
llm_api_base: ""
llm_temperature: 0.7
llm_timeout: 120
max_iterations: 32
max_tokens: 4096
shell_timeout: 30
context_window_budget: 8192
trace_enabled: true
llm_trace_log: "logs/llm_trace.jsonl"
turn_trace_log: "logs/turn_trace.jsonl"
log_file: "logs/knoa_platform.json"
runtime_root: "~/.knoa"
working_directory: "."
service_host: "127.0.0.1"
service_port: 9527
service_token: ""
owner_principal_id: "personal:owner"
owner_principal_aliases:
  - "local"
webhook_enabled: false
webhook_host: "127.0.0.1"
webhook_port: 9528
webhook_routes: {}
gateway_enabled: false
gateway_host: "127.0.0.1"
gateway_port: 9529
gateway_session_ttl_seconds: 900
gateway_artifact_max_bytes: 33554432
gateway_remote_enabled: false
gateway_public_url: ""
gateway_tls_cert_file: ""
gateway_tls_key_file: ""
feishu_enabled: false
feishu_app_id: ""
feishu_app_secret: ""
feishu_receive_id: ""
attachment_ttl_seconds: 3600
attachment_cleanup_interval_seconds: 300
audio_transcription:
  enabled: false
  tool: ""
  max_bytes: 20971520
supports_vision: null

# Dynamic MCP capabilities are disabled unless a private local config explicitly
# enables a server. Tools require local effect/capability/risk policy. Optional
# Resource Task Sources additionally require an explicit URI, principal and owned
# Session; MCP notifications alone never create work.
mcp_servers: {}

# Additional roots containing Skill package directories. Knoa also loads its
# packaged built-in Skills and ~/.knoa/skills.
skill_directories: []
# Stable Agent selected for newly bound Sessions.
default_agent: knoa
agents:
  knoa:
    enabled: true
    max_concurrency: 4
  codex:
    enabled: false
    max_concurrency: 1
    command: ["codex", "app-server"]
    # Empty means: let Codex use its normal ~/.codex configuration and
    # authentication. Set this only when an isolated Codex identity is wanted.
    home: ""
    model: ""
    # Empty uses a private neutral workspace under
    # ~/.knoa/agents/codex/workspace, never the Knoa service source directory.
    cwd: ""
    approval_policy: "never"
    sandbox: "read-only"
    request_timeout_seconds: 120
    max_line_bytes: 4194304
    max_event_queue: 1024
  # Restricted system Agent. It reuses the same Agent Runtime/provider stack,
  # but is never exposed as a Session choice and receives no Tools.
  reviewer_agent:
    enabled: false
    max_concurrency: 1
    model: ""

approval_review:
  mode: "off" # off | suggest | auto
  agent: "reviewer_agent"
  model: ""
  timeout_seconds: 60
  max_output_tokens: 4096
  auto_max_risk: "medium"

# Loopback-only standard MCP endpoint used by out-of-process Agents.
capability_mcp_host: "127.0.0.1"
capability_mcp_port: 9530
