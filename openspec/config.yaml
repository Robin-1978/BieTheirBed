schema: spec-driven

context: |
  PC Assistant is a Python 3.10+ desktop AI system with CLI/TUI and Feishu
  clients, a service transport, session-isolated ReAct execution,
  provider-neutral model adapters, deterministic tool verification, desktop and
  MCP tools, structured context/memory, and pytest-based verification.

  The principal control path is: untrusted input -> stochastic model proposal ->
  deterministic verifier/confirmation -> single verified tool commit ->
  postcondition evidence. Provider-native payloads and binary encodings are
  request-boundary data, not durable conversation content.

  The approved Agent Runtime Decomposition target uses thin CoreClient adapters,
  a versioned Core API v1, CoreServer as the only production execution authority,
  AgentRuntimePort as the Core-owned application port, AgentRuntime for session
  lifecycle, and ReActLoop with ModelStep and ToolStep operations. The target is
  a direct breaking cutover with no aliases, shims, or in-process client fallback.

