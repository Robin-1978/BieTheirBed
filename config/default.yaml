# =============================================================================
# Knoa Node 默认配置模板 (default.yaml)
# -----------------------------------------------------------------------------
# 本文件按优先级被 local.yaml / --config / 环境变量覆盖;daemon 启动时通过
# load_config() 读取。字段分两类:
#
#   1. 基础设施 (Infrastructure) —— 每次启动生效:
#      service_host/port、webhook_*、gateway_*、feishu_*、dingtalk_*、
#      trace_*、log_*、attachment_*、audio_transcription、capability_mcp_* 等。
#
#   2. Managed (运行时行为) —— 仅首次安装播种,运行时以数据库控制面为准:
#      providers / models / default_model / fallback_* / default_agent /
#      node_agents / approval_review / mcp_servers / skills。
#      首次启动时这些字段被写入 assistant.db 的 config_revisions 作为种子,
#      之后以 App / Node Console / CLI 发布到控制面的 applied revision 为准。
#      直接改本文件/local.yaml 的这些字段不会影响已初始化的运行实例!
#
# 权威来源与修改方式见 docs/knoa-configuration-control-plane-design.md。
# =============================================================================
# Named API accounts/endpoints. Cloud accounts and their keys belong in the
# per-user ~/.knoa/config/local.yaml file, outside the source tree.
# NOTE: Managed (bootstrap-only) -- runtime provider config comes from the
# Config Registry control plane, not this file, after first startup.
providers:
  local_llama:
    driver: "llamacpp"
    server_url: "http://127.0.0.1:8192"
    requires_api_key: false
    timeout: 120

# Stable application aliases mapped to upstream model identifiers.
# NOTE: Managed (bootstrap-only) -- see the header comment.
models:
  local_default:
    provider: "local_llama"
    model: ""
    supports_vision: true
    context_window: 8192

default_model: "local_default"
fallback_enabled: true
fallback_model: ""

# Single-model fallback fields used only when providers/models are absent.
llm_provider: "llamacpp"
llm_server_url: "http://127.0.0.1:8192"
llm_model_name: ""
llm_api_key: ""
llm_api_base: ""
llm_temperature: 0.7
llm_timeout: 120
max_iterations: 32
max_tokens: 4096
shell_timeout: 30
context_window_budget: 8192
trace_enabled: true
llm_trace_log: "logs/llm_trace.jsonl"
turn_trace_log: "logs/turn_trace.jsonl"
log_file: "logs/knoa_platform.json"
runtime_root: "~/.knoa"
working_directory: "."
service_host: "127.0.0.1"
service_port: 9527
service_token: ""
owner_principal_id: "personal:owner"
owner_principal_aliases:
  - "local"
webhook_enabled: false
webhook_host: "127.0.0.1"
webhook_port: 9528
webhook_routes: {}
gateway_enabled: false
gateway_host: "127.0.0.1"
gateway_port: 9529
gateway_lan_enabled: false
gateway_lan_host: "0.0.0.0"
gateway_lan_port: 9541
gateway_session_ttl_seconds: 900
gateway_artifact_max_bytes: 33554432
gateway_remote_enabled: false
gateway_public_url: ""
gateway_tls_cert_file: ""
gateway_tls_key_file: ""
feishu_enabled: false
feishu_app_id: ""
feishu_app_secret: ""
feishu_receive_id: ""
dingtalk_enabled: false
dingtalk_client_id: ""
dingtalk_client_secret: ""
dingtalk_robot_code: ""
dingtalk_receive_id: ""
attachment_ttl_seconds: 3600
attachment_cleanup_interval_seconds: 300
audio_transcription:
  enabled: false
  tool: ""
  max_bytes: 20971520
supports_vision: null
screen_grid_enabled: false
screen_verify_enabled: false
ui_backend: "auto"  # auto, atspi, uia, none

# Dynamic MCP capabilities are disabled unless a private local config explicitly
# enables a server. Tools require local effect/capability/risk policy. Optional
# Resource Task Sources additionally require an explicit URI, principal and owned
# Session; MCP notifications alone never create work.
mcp_servers: {}

# Additional roots containing Skill package directories. Knoa also loads its
# packaged built-in Skills and ~/.knoa/skills.
skill_directories: []
# Agents are complete Node-owned configurations. The YAML is an
# initialization/import document; after first startup the versioned Config
# Registry is the managed source of truth for this Node.
default_agent: knoa
node_agents:
  knoa:
    kind: knoa
    display_name: "Knoa Agent"
    instructions_ref: "builtin://assistant"
    visibility: user
    model_binding:
      ownership: platform
      model: "@default"
    max_concurrency: 4
    default_skill_refs: [research_report]
    allowed_skill_refs: [research_report]
    allowed_platform_tools: ["*"]
    platform_capability_ceiling: ["*"]
    delegation:
      allowed: true
      targets: [codex]
      max_depth: 1
      max_children: 3
      max_parallel_children: 3
      max_deadline_seconds: 1800

  reviewer_agent:
    kind: knoa
    display_name: "Knoa Reviewer"
    instructions_ref: "builtin://approval-reviewer"
    visibility: system
    enabled: false
    model_binding:
      ownership: platform
      model: "@reviewer"
    max_concurrency: 1
    runtime_limits:
      max_iterations: 1
    callable_by: [approval_service]

  codex:
    kind: codex
    display_name: "Codex Agent"
    instructions_ref: "builtin://coder"
    visibility: delegate
    enabled: false
    model_binding:
      ownership: runtime
    max_concurrency: 1
    backend: exec_json
    command: ["codex", "exec"]
    home: "agents/codex/home"
    cwd: "agents/codex/workspace"
    approval_policy: "never"
    sandbox: "read-only"
    native_capability_ceiling: [workspace_read, command_execution]
    request_timeout_seconds: 600
    max_line_bytes: 4194304
    max_event_queue: 1024

approval_review:
  # Managed (bootstrap-only) -- runtime mode is governed by the Config Registry
  # control plane (App/Console). local.yaml edits do not change a running Node.
  mode: "off" # off | suggest | auto
  agent: "reviewer_agent"
  model: ""
  timeout_seconds: 60
  max_output_tokens: 4096
  auto_max_risk: "medium"

# Loopback-only standard MCP endpoint used by out-of-process Agents.
capability_mcp_host: "127.0.0.1"
capability_mcp_port: 9530
