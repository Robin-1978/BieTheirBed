name: CI

on:
  push:
  pull_request:

jobs:
  native-updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native updater formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Test native signed Bundle updater
        run: cargo test -p knoa-update --locked

  protocol-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Verify versioned protocol descriptors and fixtures
        run: python scripts/check_protocol_contracts.py
      - name: Verify signed Release Manifest schema
        run: python scripts/check_release_manifest.py

  release-role-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        role: [hub, node, all]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cross-platform release role contract
        run: python scripts/check_release_role.py --role ${{ matrix.role }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Verify runtime API and database baseline
        run: python scripts/capture_runtime_baseline.py
      - name: Verify Relay performance budgets
        run: python scripts/benchmark_relay.py --check
      - name: Lint
        run: ruff check src tests scripts
      - name: Test and enforce Core coverage
        run: python -m pytest -q --cov --cov-report=term-missing

  linux-python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test Linux runtime on Python 3.14
        run: python -m pytest -q

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Build Windows-installable wheel
        run: python -m build
      - name: Lint portable runtime and deployment tests
        run: ruff check src tests scripts
      - name: Parse Windows PowerShell deployment scripts
        shell: powershell
        run: |
          Get-ChildItem deploy/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Test native Windows Hub and Node primitives
        run: >-
          python -m pytest -q
          tests/test_private_files.py
          tests/test_windows_portability.py
          tests/test_hosted_hub_simulation.py
          tests/test_cli_entry.py

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/knoa-mobile/package-lock.json
      - name: Install Gateway contract exporter
        run: python -m pip install -e .
      - name: Install mobile dependencies
        working-directory: apps/knoa-mobile
        run: npm ci && npm audit --audit-level=critical
      - name: Verify generated Gateway contract
        working-directory: apps/knoa-mobile
        run: npm run contract && git diff --exit-code -- openapi.json src/api/schema.ts
      - name: Typecheck and test mobile workbench
        working-directory: apps/knoa-mobile
        run: npm run typecheck && npm test && npm run doctor && npm run bundle:android
