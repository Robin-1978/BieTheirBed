[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pc_assistant"
version = "0.1.0"
description = "A Python computer assistant agent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "mss>=9.0",
    "pyperclip>=1.8",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "ddgs>=9.0",
    "textual>=8.2.0",
    "pyautogui>=0.9.54",
    "pywinctl>=0.0.5",
    "plyer>=2.1.0",
    "jsonschema>=4.0",
    "websockets>=14.0,<16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
[project.scripts]
pca = "pc_assistant:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_assistant"]

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.feishu_open_id",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pc_assistant",
    "/tests",
    "/config/default.yaml",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "pc_assistant/resources/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests requiring an explicitly enabled external LLM service",
]

[tool.coverage.run]
source = [
    "pc_assistant.agent_runtime",
    "pc_assistant.artifacts",
    "pc_assistant.context.memory_db",
    "pc_assistant.context.scope",
    "pc_assistant.desktop_session",
    "pc_assistant.service.core_api",
    "pc_assistant.service.core_client",
    "pc_assistant.service.core_host",
    "pc_assistant.service.core_server",
    "pc_assistant.tools.base",
    "pc_assistant.tools.registry",
]
omit = ["src/pc_assistant/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 80
