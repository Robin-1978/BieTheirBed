[workspace]
members = ["crates/knoa-update"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
