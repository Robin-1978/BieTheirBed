schema: spec-driven

context: |
  PC Assistant is a Python 3.10+ desktop AI agent with CLI/TUI and Feishu
  entrypoints, an optional daemon transport, a session-isolated ReAct Agent,
  provider-neutral model adapters, deterministic tool verification, desktop and
  MCP tools, structured context/memory, and pytest-based verification.

  The architectural control path is: untrusted input -> Agent proposal ->
  deterministic verifier/confirmation -> tool execution -> postcondition evidence.
  Provider-native payloads and large binary encodings are request-boundary data,
  not durable conversation content.

  The approved runtime target uses one configurable application runtime root
  with sibling logs/, attachments/, and cache/ directories. Socket and PID files
  may use the operating system's ephemeral runtime location.

  The secure-multimodal-gui Campaign is in planning. Current inline image data
  URLs are transitional and must not be treated as the target architecture.

knowledge_base:
