name: CI

on:
  push:
  pull_request:

jobs:
  native-updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native updater formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Test native signed Bundle updater
        run: cargo test -p knoa-update --locked

  protocol-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Install locked protocol dependencies
        run: uv sync --locked --python 3.12
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify versioned protocol descriptors and fixtures
        run: uv run --no-sync python scripts/check_protocol_contracts.py
      - name: Verify signed Release Manifest schema
        run: uv run --no-sync python scripts/check_release_manifest.py
      - name: Verify product release versions
        run: uv run --no-sync python scripts/version_manager.py check

  release-role-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        role: [hub, node, all]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cross-platform release role contract
        run: python scripts/check_release_role.py --role ${{ matrix.role }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Install project and development tools
        run: uv sync --locked --extra dev --python 3.12
      - name: Verify Python dependency lock
        run: uv lock --check
      - name: Build distributions
        run: uv run --no-sync python -m build
      - name: Verify runtime API and database baseline
        run: uv run --no-sync python scripts/capture_runtime_baseline.py
      - name: Verify Relay performance budgets
        run: uv run --no-sync python scripts/benchmark_relay.py --check
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Test and enforce Core coverage
        run: uv run --no-sync python -m pytest -q --cov --cov-report=term-missing

  linux-python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Install project and development tools
        run: uv sync --locked --extra dev --python 3.14
      - name: Test Linux runtime on Python 3.14
        run: uv run --no-sync python -m pytest -q

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Install project and development tools
        run: uv sync --locked --extra dev --python 3.14
      - name: Build Windows-installable wheel
        run: uv run --no-sync python -m build
      - name: Lint portable runtime and deployment tests
        run: uv run --no-sync ruff check src tests scripts
      - name: Parse Windows PowerShell deployment scripts
        shell: powershell
        run: |
          Get-ChildItem deploy/windows/*.ps1, deploy/product/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Test native Windows Hub and Node primitives
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_private_files.py
          tests/test_windows_portability.py
          tests/test_hosted_hub_simulation.py
          tests/test_cli_entry.py

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/knoa-mobile/package-lock.json
      - name: Install Gateway contract exporter
        run: uv sync --locked --python 3.12
      - name: Install mobile dependencies
        working-directory: apps/knoa-mobile
        run: npm ci && npm audit --audit-level=critical
      - name: Verify generated Gateway contract
        working-directory: apps/knoa-mobile
        run: >-
          uv run --project ../.. --no-sync npm run contract &&
          git diff --exit-code -- openapi.json src/api/schema.ts
      - name: Typecheck and test mobile workbench
        working-directory: apps/knoa-mobile
        run: npm run typecheck && npm test && npm run doctor && npm run bundle:android
