enabled: true
transport: stdio
command: python3
args:
  - server.py
working_directory: .
inherit_env:
  - JIRA_BASE_URL
  - JIRA_API_TOKEN
  - JIRA_AUTH_MODE
optional_env:
  - JIRA_USERNAME
  - JIRA_API_VERSION
  - JIRA_JQL
  - JIRA_POLL_INTERVAL_SECONDS
  - JIRA_EVENT_RETENTION_DAYS
  - JIRA_MAX_ISSUES
  - JIRA_MCP_STATE_PATH
  - JIRA_ATTACHMENT_ROOT
  - JIRA_CODE_ROOT
  - JIRA_LOG_ROOT
  - JIRA_ANALYSIS_PROMPT_PATH
  - JIRA_MAX_ATTACHMENT_BYTES
  - JIRA_WRITE_ENABLED
timeout_seconds: 300
tools:
  jira.get_issue:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.get_comments:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.find_assignable_users:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.list_attachments:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.get_attachment_excerpt:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.download_attachment:
    effect: local_write
    capabilities: [mcp, network, host_write]
    risk: medium
  jira.materialize_issue:
    effect: local_write
    capabilities: [mcp, network, host_write]
    risk: medium
  jira.add_comment:
    effect: external_side_effect
    capabilities: [mcp, network]
    risk: high
  jira.assign_issue:
    effect: external_side_effect
    capabilities: [mcp, network]
    risk: high
  jira.list_transitions:
    effect: read_only
    capabilities: [mcp, network]
    risk: low
  jira.transition_issue:
    effect: external_side_effect
    capabilities: [mcp, network]
    risk: high
